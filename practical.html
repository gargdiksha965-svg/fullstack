<!DOCTYPE html>
<html>
<head>
    <title>Simple JWT Authentication</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            width: 320px;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }

        #message {
            color: red;
        }

        #dashboard {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div id="loginBox">
        <h2>Login</h2>

        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">

        <br>

        <button onclick="login()">Login</button>

        <p id="message"></p>
    </div>

    <div id="dashboard">
        <h2>Dashboard</h2>

        <p>Welcome User: <span id="userId"></span></p>
        <p>Your Role: <b id="role"></b></p>

        <button onclick="logout()">Logout</button>
    </div>

</div>

<script>

function login() {

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if (username === "admin" && password === "1234") {

        let payload = {
            userId: 101,
            role: "Admin"
        };

        let token = btoa(JSON.stringify(payload));

        localStorage.setItem("token", token);

        showDashboard();

    } else {

        document.getElementById("message").innerText =
            "Invalid username or password";
    }
}

function showDashboard() {

    let token = localStorage.getItem("token");

    if (!token) {
        return;
    }

    let data = JSON.parse(atob(token));

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    document.getElementById("userId").innerText = data.userId;
    document.getElementById("role").innerText = data.role;
}

function logout() {

    localStorage.removeItem("token");

    document.getElementById("loginBox").style.display = "block";
    document.getElementById("dashboard").style.display = "none";
}

window.onload = function() {

    if (localStorage.getItem("token")) {
        showDashboard();
    }

};

</script>

</body>
</html>
